<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Hestia · Sign in</title>
  <script>
    // Same saved theme choice as the dashboard (set before first paint).
    try {
      var t = localStorage.getItem('hestia_theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f1e6d3; --surface: #faf3e6; --border: #e4d3b3; --text: #1f3b3d;
      --muted: #6b5b47; --accent: #c1502e; --accent2: #a63f28; --red: #a63f28;
      --shadow: 0 10px 28px rgba(31,59,61,0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14201f; --surface: #1b2928; --border: #2d3d3b; --text: #ecdfc8;
        --muted: #9a9282; --accent: #d6673f; --accent2: #c1502e; --red: #e0805a;
        --shadow: 0 10px 28px rgba(0,0,0,0.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #14201f; --surface: #1b2928; --border: #2d3d3b; --text: #ecdfc8;
      --muted: #9a9282; --accent: #d6673f; --accent2: #c1502e; --red: #e0805a;
      --shadow: 0 10px 28px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }
    main {
      width: 100%; max-width: 360px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      box-shadow: var(--shadow); padding: 28px 24px;
    }
    h1 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; font-size: 28px; }
    p.sub { color: var(--muted); font-size: 14px; margin: 6px 0 20px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type=password] {
      width: 100%; padding: 12px; font-size: 16px; /* 16px stops iOS zooming in */
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text);
    }
    input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      width: 100%; margin-top: 16px; padding: 12px; font-size: 16px; cursor: pointer;
      border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 500;
    }
    button:hover { background: var(--accent2); }
    .err { color: var(--red); font-size: 14px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Hestia</h1>
    <p class="sub">Sign in to continue.</p>
    {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>

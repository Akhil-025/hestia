# Backlog #197: the secret scan runs on every push and pull request, so a
# regression is caught even if the local pre-commit hook was skipped.
name: ci

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for secrets (high confidence fails the build)
        run: python audit_secrets.py --fail-on high --no-report

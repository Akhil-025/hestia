# --- Hindi/Hinglish (backlog #27) ------------------------------------------
# Common Romanized Hindi/Hinglish phrasings, merged directly into the
# relevant intent's block above rather than duplicated here as separate
# top-level keys — a repeated YAML key silently overwrites the earlier
# one when parsed, which is exactly what a first draft of this section
# did (see git history / CHANGELOG.md if curious). Two intents have no
# earlier English block to merge into, so they're new entries below.
#
# Reuses the exact mechanism #22 built for English phrasings the model
# gets wrong — a deterministic, zero-latency pre-LLM match beats hoping
# the model's Hindi/Hinglish handling is reliable for phrases used often.
# See config/nlu_prompt.txt's "Multi-language input" section for what
# covers everything these aliases don't (novel phrasings, full Devanagari
# script, free-text entity content in Hindi).

get_weather:
  - "mausam kaisa hai"
  - "aaj mausam"

take_note:
  - "note likho"
  - "ye likh lo"
  - "yaad rakho ki"

# --- Metis / Orpheus: writing workflow (backlog #164-#168) ------------------
# Only phrasings that are unambiguous on their own. "revise my last poem",
# "export my last poem" etc. deliberately stay with the NLU: they need a
# type/instruction entity to pick the right creation, which an alias can't
# supply (an alias sets the intent only).
metis_writing_session:

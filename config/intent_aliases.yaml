# config/intent_aliases.yaml
#
# Phrase -> intent aliases, resolved BEFORE the LLM is called (see
# core/intent_aliases.py). A match here short-circuits classification
# entirely: no Ollama round-trip, no retry loop, no dependence on JSON-mode
# reliability for phrasings you already know the answer to.
#
# Use this instead of adding yet another few-shot example to
# config/nlu_prompt.txt when:
#   - the phrasing is unambiguous to you, and
#   - the intent is the same every single time, and
#   - the model keeps getting it wrong anyway.
#
# Format — two accepted shapes per intent:
#
#   apollo_track_sleep:
#     - "log my sleep"                # string = prefix match (the default)
#     - phrase: "i slept"
#       match: prefix                 # exact | prefix | contains
#
# Match modes:
#   exact     the whole query equals the phrase
#   prefix    the query starts with the phrase  <- default, safest for logging
#   contains  the phrase appears anywhere as whole words (use sparingly:
#             this is the mode most likely to fire when you didn't mean it)
#
# Every intent name here MUST exist in modules/hecate/intent_registry.py.
# Unknown intents are dropped with a warning at startup rather than
# silently producing something Hecate can't route — the registry stays the
# single source of truth. tests/test_intent_aliases.py enforces this.
#
# Entities are NOT extracted here; an alias sets the intent only. Modules
# already parse amounts/durations out of `raw_query` themselves, which is
# why "log my sleep for 7 hours" still works with an empty entity dict.


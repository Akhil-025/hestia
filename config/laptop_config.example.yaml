# config/laptop_config.example.yaml
#
# Template — copy this to config/laptop_config.yaml and fill in your own
# values. laptop_config.yaml itself is gitignored (see .gitignore) so your
# real Telegram chat ID, local paths, etc. never get committed. This file
# should only ever contain placeholders.


# Browser automation
browser:
  enabled: true
  headless: true

# Web UI dashboard
webui:
  enabled: true
  host: "127.0.0.1"
  port: 5000

# Google integration
google:
  enabled: true
  credentials_path: "config/google_credentials.json"
  token_path: "data/google_token.json"

# General
database:
  path: "data/hestia.db"

# STT (Whisper via faster-whisper)
stt:
  model_size: "base.en"
  # "auto" picks cuda if a usable GPU is detected, else cpu. "cuda" now
  # also degrades to cpu automatically (with a printed warning) instead of
  # crashing on machines without an NVIDIA GPU — see core/stt.py's
  # _resolve_device(). float16 is only valid on GPU and is auto-downgraded
  # to int8 whenever the resolved device is cpu, so this is safe to leave
  # as-is on any machine.
  device: "auto"
  compute_type: "float16"
  samplerate: 16000
  noise_filter: true
  # vad_aggressiveness: 2   # webrtcvad 0-3; if unset, uses the value from
  #                         # `python main.py --calibrate-mic`, else 2.

# TTS
tts:
  engine: "pyttsx3"  # or "piper", "coqui"
  rate: 175
  volume: 1.0
  piper_model_path: "models/piper/en_US-lessac-medium.onnx"
  # Optional distinct voices per kind of reply (backlog #170). Each profile
  # overrides only what it sets: `voice_name` (a substring of an installed
  # pyttsx3 voice name), `piper_model_path`, `rate`, `volume`. Then say which
  # module speaks in which profile; modules not listed use `default`, and
  # with no `default` they use the base voice above. Proactive announcements
  # (reminders, nudges) use the module that raised them.
  # voices:
  #   calm:
  #     voice_name: "Hazel"
  #     rate: 160
  #     piper_model_path: "models/piper/en_GB-alba-medium.onnx"
  #   brisk:
  #     rate: 190
  # voice_by_module:
  #   apollo: calm       # health
  #   artemis: calm
  #   pluto: brisk       # finance
  #   default: null

# Wake word (Vosk)
wake_word:
  model_path: "models/vosk-model-small-en-us-0.15"
  wake_words: null
  # quiet = also accept near-miss spellings (soft voice, quiet room)
  # normal = exact match (default)  noisy = stricter, fewer false wakes
  # Say "I'm in a noisy room" / "I'm in a quiet room" to switch live.
  # sensitivity: "normal"

# Barge-in: lets you interrupt Hestia mid-reply by just talking over her,
# instead of waiting for her to finish — see core/barge_in.py. Only ever
# listens while she's actually speaking, so it never competes with
# wake-word detection or STT for the microphone.
#
# IMPORTANT — no echo cancellation: this is plain VAD + amplitude
# detection, not real acoustic echo cancellation (AEC). On a laptop with
# the mic and speakers close together, Hestia's own voice can bleed into
# the mic and trigger a false self-interruption. `min_rms` below is a
# partial mitigation, not a fix — a headset (mic physically isolated
# from the speaker output) is the reliable way to avoid this.
barge_in:
  enabled: true
  vad_aggressiveness: 2       # webrtcvad 0-3, higher = stricter
  speech_frames_to_trigger: 3  # consecutive 30ms speech frames (~90ms) to fire
  min_rms: 300.0               # amplitude floor (0-32768) a frame must also
                                # clear to count toward the trigger; raise
                                # this (try 600-1200) if Hestia is cutting
                                # herself off on laptop speakers, lower it
                                # (or set to 0) if real interruptions are
                                # being missed. See core/barge_in.py.
  pre_roll_frames: 10          # ~300ms of audio kept buffered before a
                                # trigger so the follow-up recording isn't
                                # missing its lead-in
  post_trigger_silence_frames: 25  # ~750ms of silence ends the follow-up
                                    # recording that starts once barge-in
                                    # fires
  max_capture_seconds: 12.0    # hard cap on that follow-up recording
  # use_calibration: true      # fill unset min_rms / vad_aggressiveness /
                                # wake_word.sensitivity from the file written by
                                # `python main.py --calibrate-mic`. Anything you
                                # set explicitly in this file wins.
  # Experimental acoustic echo cancellation (adaptive filter) for the
  # self-interruption problem above. Needs tts.engine: "piper" (the only
  # engine whose output Hestia can see), so it does nothing with pyttsx3.
  # Synthetic-tested only — compare against a headset before trusting it.
  # echo_cancel:
  #   enabled: false
  #   filter_len: 1024        # taps; 1024 = 64 ms at 16 kHz
  #   mu: 0.4                 # adaptation step (0-2)
  #   delay_ms: 0             # raise if speaker->mic latency exceeds the filter

# Ollama
ollama:
  model: "mistral"
  host: "127.0.0.1"
  port: 11434

# Chronos (time/date/weather/reminders) — get_time/get_date default to
# UTC if this is missing, which will look "wrong" for any non-UTC user.
chronos:
  timezone: "Asia/Kolkata"
  # Reminder options (all optional; defaults shown).
  scheduler_enabled: true            # background loop that fires reminders
  scheduler_interval_seconds: 30     # how often it checks what is due
  default_snooze_minutes: 10         # length of "snooze" when you don't say
  skip_public_holidays: false        # reminders marked "skip holidays" also skip public ones
  holiday_country: "IN"              # ISO code used for public-holiday lookups
  proactive_weather: false           # warn once each morning if rain threatens an outdoor plan
  exports_dir: "data/exports"        # where ICS exports are written

# Writing (Metis + Orpheus) — all optional; defaults shown.
writing:
  polish_pass: false                 # give every new poem/story/lyrics one Metis critique-and-polish pass
  export_dir: "data/exports"         # where "export my last poem" / "export that session" write .md/.txt files
  plagiarism_web_check: true         # let Metis spot-check passages with a web search (needs the browser)

# Apollo (health) — all optional; defaults shown.
apollo:
  # timezone: "Asia/Kolkata"         # day boundaries for streaks/summaries; defaults to chronos.timezone
  units:
    weight: "kg"                     # kg | lb   (or say "switch to pounds"); storage is always kg/ml
    water: "ml"                      # ml | oz
  min_sample: 4                      # days needed in each group before a correlation is reported
  streak_min_sessions: 2             # sessions/week for a workout "week streak"
  hydration:
    enabled: true                    # nudge only when you're behind pace
    wake_start: "07:00"              # pacing runs between these; no nudges outside them
    wake_end: "22:00"
    threshold_ml: 400                # how far behind pace before nudging
    cooldown_minutes: 90
    daily_cap: 4
  weekly_summary:
    enabled: true
    weekday: 6                       # 0=Mon .. 6=Sun; sent once per week on/after this day
    hour: 18
  goal_reminders:
    enabled: false                   # weight-goal check-ins are off unless you opt in
    every_days: 7
  burnout:
    enabled: true                    # weekly; only speaks up when signals are worth a look
  # import_dir: "data/apollo/imports"  # folder for `import my steps` (CSV/JSON: a date column + a steps column)

dionysus:
  mood_aware: true                   # use your logged mood for movie/music picks when you give none
  dismiss_expire_days: 180           # a dismissed title can come back after this many days (0 = never)

artemis:
  # timezone: "Asia/Kolkata"         # clock for focus sessions and "usually done by" times; defaults to chronos.timezone
  nudges:                            # gentle reminder when a habit you usually log by a certain time isn't logged yet
    enabled: true                    # needs ~5 logged completions per habit; one nudge per habit per day, none after 22:00
    lateness_minutes: 60             # how long past your usual time before nudging
  habit_grace_days: 0                # missed days a habit streak survives (0-7); a habit can set its own ("give reading a grace period of 2 days")

ares:
  # auto_review_days: 14             # also remind me to revisit every plan/decision/career ranking after N days (off by default; "revisit it in 2 weeks" works any time)
  # db_path: "data/ares/ares.db"     # where Ares keeps tracked decisions, outcomes and playbooks

# Surface disagreements between modules (e.g. Apollo says rest, Artemis says push).
consensus:
  enabled: true                      # kill switch; only appends a note on a few intents

# Off-peak SQLite housekeeping (0-5am, at most weekly per file; never deletes data).
maintenance:
  enabled: true
  free_ratio_threshold: 0.2          # vacuum only when >=20% of a file is free pages
  min_interval_days: 7

# LLM providers (priority order)
llm:
  providers:
    - name: "ollama"
      model: "mistral"
      host: "127.0.0.1"
      port: 11434

# NLU
nlu:
  prompt_path: "config/nlu_prompt.txt"
  # Optional — point classification at a separate model and/or a separate
  # Ollama instance, independent of the `ollama:` block above (which
  # reasoning/chat/RAG/Pluto's ReAct agent still use). Classification is a
  # small structured JSON call, not full reasoning, so a smaller/faster
  # model here can cut per-query latency without touching response quality
  # elsewhere. Leave commented out to keep NLU on `ollama.model` (no
  # behaviour change). Check `ollama list` for models you already have
  # pulled, or `ollama pull <name>` for a small one, before setting this.
  # model: "phi3"
  # host: "127.0.0.1"
  # port: 11435

hecate:
  # Conversation session TTL, in seconds (backlog #12). A gap longer than
  # this since the last turn clears conversational context (recent
  # intents, extracted entities, time/memory context) so "add it to the
  # list" three hours after an unrelated conversation doesn't inherit that
  # conversation's entities. Registered modules and active_modules are
  # NOT affected — this only resets conversation state, never
  # registration state. Default (also used if this whole section or this
  # key is omitted) is 1800 (30 minutes). Set to 0 to disable expiry
  # entirely and keep context for the life of the process.
  session_ttl_seconds: 1800

# Scheduler
scheduler:
  enabled: true
  check_interval: 60  # seconds

heartbeat:
  enabled: true
  interval: 1800
  summarise_interval: 86400

skills:
  path: "skills"
  enabled: true

telegram:
  enabled: true
  # No `token:` key here on purpose. yaml.safe_load doesn't interpolate
  # ${VAR} syntax, so a placeholder here would never resolve to a real
  # value anyway — and secrets belong in the environment, not a file
  # that might get committed or zipped up. Set the TELEGRAM_BOT_TOKEN
  # environment variable instead; main.py's build_telegram_bot() reads
  # it from there directly. See that method's docstring for the full
  # rationale.
  allowed_chat_ids: [123456789]  # your Telegram chat id — message @userinfobot to get yours

athena:
  enabled: true

mnemosyne:
  enabled: true

  # Everything below is optional and OFF by default.

  # Obsidian vault sync (backlog #39). Reading is always read-only. Hestia
  # only ever CREATES new notes in <vault>/<subfolder>/ and never edits or
  # overwrites existing ones; `writeback` is its own switch.
  obsidian:
    enabled: false
    vault_path: "C:/Users/YOUR_USERNAME/Documents/MyVault"
    subfolder: "Hestia"
    writeback: false          # weekly digests and new-paper lists become notes

  # arXiv monitoring (backlog #47). Add topics by voice: "watch arxiv for ...".
  # New papers are written as markdown into Athena's documents folder
  # (<athena data_dir>/arxiv unless docs_dir is set) and indexed by its ingest.
  papers:
    enabled: false
    max_new_per_query: 5
    lookback_days: 14
    # docs_dir: "data/athena/documents/arxiv"

  # Episodic clustering (backlog #43). Bag-of-words by default; embeddings are
  # more accurate but load the sentence-transformer model.
  episodes:
    use_embeddings: false

iris:
  enabled: true
  source_dir: "C:/Users/YOUR_USERNAME/Pictures"  # e.g. "/home/you/Pictures" on Linux/macOS

  # Optional overrides (recommended later)
  db_path: "data/iris/iris.db"
  output_dir: "data/iris/organized"
  cache_dir: "data/iris/cache"
  chroma_dir: "data/iris/chroma_db"

  batch_size: 50
  max_workers: 4
  use_gpu: false


sync:
  enabled: false   # set true to enable multi-device sync API on port 5001
notes:
  small talk: Statements about how the user feels, greetings and thanks are chat;
    do not use clarify_intent for them.
  calendar create: create_event needs a title and a when (put the whole phrase in
    time). It is NOT check_schedule_gaps, which only inspects free time.
  food: Hunger or wanting to eat is dionysus_find_restaurant, not a web search.

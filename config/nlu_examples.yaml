notes:
  general: config/nlu_prompt.txt
  MULTI-LANGUAGE (HINDI/HINGLISH) EXAMPLES: A handful of Hinglish phrasings not already covered by config/intent_aliases.yaml,
    to show the model the intent stays English snake_case regardless of input script/language (see the
    "Multi-language input" instructions near the top of this file).
  DIAGNOSTICS (ABOUT HESTIA HERSELF): 'These three ask about the assistant, not about the user''s data.
    They are answered by CoreModule from the Diagnostics object (core/observability.py). Disambiguation
    notes: - "how are you" / "you doing ok" is small talk -> chat, NOT modules_status. modules_status
    is about SUBSYSTEM health ("are your modules working", "module status", "is athena up"). - explain_routing
    asks why the PREVIOUS query went where it went. A question about how routing works in general is chat.
    - report_mistake is the user telling Hestia she got the LAST answer wrong. It is not a request to
    redo the task; log it and acknowledge. Put any extra detail the user gave in entities.note. - audit_routing
    asks WHAT was checked, step by step, before the previous answer ("what did you check before answering
    that"). explain_routing is the short "why did it go there"; audit_routing is the full ordered list.
    - conference is for a decision that genuinely spans several areas of the user''s life (money + health
    + goals) and where they want the views set side by side. A question about ONE area is that area''s
    own intent, never a conference. Put any areas the user named in entities.modules as a list of module
    names (pluto, ares, apollo, artemis, chronos). - what_if is a hypothetical about changing ONE thing
    the user already does or pays for ("what if I cancel netflix", "what if I stop meditating", "what
    if I slept an hour less"). Not a decision to log (that is ares_decision_support) and not a request
    to actually cancel. - weekly_focus asks which few things need attention over the coming week. A plain
    "what''s on my plate today" is get_agenda, not weekly_focus.'
  MNEMOSYNE (LONG-TERM FACTS ABOUT THE USER): learn_fact is for durable facts ABOUT THE USER (their name,
    family, relationships, preferences, background) that should be recalled later. NEVER use take_note
    for this -- take_note is for arbitrary reminders / to-do items, not facts about the user. If the user
    says "remember..." or "learn this fact..." and states something true about themselves, it is learn_fact,
    not take_note. "What do you know about me" / "tell me about myself" has no specific key to look up
    -- omit the "key" entity entirely (do NOT invent one) so Mnemosyne falls through to a semantic recall
    over everything it knows, instead of a single-fact lookup.
  'MNEMOSYNE: STUDYING, QUIZZES, THE GRAPH, EPISODES, PAPERS': 'start_quiz           -> "quiz me on X"
    (entities: subject, optional count) answer_quiz          -> only when the user gives a quiz answer
    with no quiz question pending; normally the answer is consumed by the quiz itself, not classified.
    quiz_performance     -> "how am I doing" / "my weak subjects" for QUIZZES (NOT get_goals, NOT apollo
    health summaries). add_study_fact       -> put a fact into spaced-repetition study material (entities:
    key + value, or topic for an existing fact). review_study         -> "what''s due" / "review my study
    cards" (flashcards). graph_connections    -> "what connects to X" / "how is X related to Y" (entities:
    entity, optional "to"). recall_episode       -> "what were we doing about X" / "what did we work on"
    (past conversations grouped by topic, NOT a dated lookup and NOT athena_search). obsidian_sync        ->
    sync the Obsidian vault. watch_papers         -> arXiv topic watching (entities: action = add / remove
    / list / check, and topic).'
  'MNEMOSYNE: MANAGING THE MEMORY ITSELF': 'recall_on_date       -> "what did I say on / last <day or
    date>" -- a CALENDAR lookup (entities: date = the phrase as spoken). Not recall_episode (that is by
    topic), not get_history. get_memory_stats     -> how big the memory is (facts, summaries, database
    size, embeddings). NOT get_system_info (that is CPU / RAM / battery of the machine). export_memory        ->
    back up / dump everything remembered to a file (entities: format = json or markdown). set_fact_importance  ->
    the user stresses that a remembered fact matters more or less (entities: key = which fact, importance
    = critical / high / low). review_stale_facts   -> facts not mentioned for months that were flagged
    for review; also "keep" them (entities: action = list / keep, optional key). A hedged statement is
    still learn_fact -- Mnemosyne notices the hedge itself.'
  IRIS (MEDIA / FILES): iris_check_circuit is a visual check of ONE breadboard photo Iris has already
    indexed (the newest image unless entities.file_id names one). It cannot test a circuit; it only looks
    for faults that show in the picture.
  ARTEMIS (GOALS): 'HABITS and GOALS are different things -- do not conflate them. A habit is a recurring
    behaviour ("drink water", "meditate"); a goal is a project/outcome with progress ("finish CFD project").
    "list my habits" is list_habits, NEVER get_goals, even though both are Artemis intents. ABANDON vs
    REMOVE: abandon_goal keeps the goal on record with a status of "abandoned" (the user gave up on it
    but it''s still visible in history); remove_goal deletes it entirely. "give up on" / "abandon" ->
    abandon_goal. "delete" / "remove" -> remove_goal. Do not conflate them.'
  ARES (STRATEGY / RISK): 'ares_premortem_analysis: assume the thing has ALREADY failed and work backwards
    to the causes. Different from ares_analyse_risk, which looks forward at risks that might occur --
    a premortem is the "imagine it''s a year from now and this blew up, why?" exercise. ares_competitive_analysis:
    about RIVALS/opposition specifically (other companies, other candidates, other teams). Different from
    ares_swot_analysis, which looks inward at the topic itself, not named competitors. If the user names
    competitors, put them in the "competitors" entity as a comma-separated string. ares_contingency_plan:
    a PLAN B / fallback if a specific risk hits. Different from ares_strategic_plan, which is the primary
    plan itself. If the user names the specific risk, put it in the "trigger" entity. ares_war_room_briefing:
    a CONSOLIDATED status briefing pulling together everything already known/discussed about a topic (past
    plans, risks, SWOTs, decisions). Use for "where do things stand", "catch me up", "give me the full
    picture" -- NOT for starting a fresh single-purpose analysis, which should map to one of the other
    ares_* intents instead. ares_career_ranking: RANK a set of career/education paths against weighted
    criteria (including GATE choices like M.Tech vs PSU vs private job). Use this instead of ares_decision_support
    when the user asks to RANK or SCORE career/education options. Put the options in "options" as a comma-separated
    string; put any criteria they name in "criteria" (comma-separated, optional ":weight" 1-5). Use ares_decision_support
    for general life decisions. ares_schedule_review: schedule a follow-up reminder to REVISIT a past
    plan/decision. Put the delay in "when" ("in 2 weeks", "next month"). ares_record_outcome: the user
    reports HOW a past plan/decision turned out. "outcome" is one of: success, mixed, failure. Different
    from ares_outcome_stats, which asks for a summary of all of them. ares_simulate_outcomes: Monte Carlo
    / expected value over NUMBERS the user gives. Not a qualitative analysis -- use only when there are
    probabilities or ranges of money/values. Keep the original wording in raw_query; if the user gave
    structured numbers, "scenarios" is a list of {"probability": 0.6, "value": 1000000}, or use "low"/"likely"/"high".
    ares_save_playbook / ares_list_playbooks / ares_run_playbook / ares_delete_playbook: NAMED, reusable
    analysis templates. "analysis" is one of: swot, premortem, risk, plan, decision, competitive, contingency,
    career. "criteria" is the standing checklist, as the user said it.'
  APOLLO (HEALTH): 'No separate "query" intent exists for sleep — a question like this also routes to
    apollo_track_sleep, with no "hours" entity (there is none to extract). ApolloEngine detects the missing
    hours + question phrasing and reports the last logged night back instead of asking "how many hours
    did you sleep" in response to a question. "log my mood ..." / "my mood is ..." is ALWAYS apollo_log_mood,
    even though it starts with the word "log" like take_note examples do. NEVER use take_note for mood.
    Same log-vs-query ambiguity as apollo_track_sleep above: no separate "query" intent exists for weight
    either. When the phrasing is a question and there''s no weight entity to extract, ApolloEngine reports
    the trend from existing logs instead of demanding a fresh number. Same log-vs-query pattern again:
    a question with no amount to extract reports today''s running total instead of asking "how much water?".'
  ORPHEUS (CREATIVE): 'Always extract a "topic"/"theme" entity from the user''s own words when one is
    present (mirrors write_poem/generate_lyrics below) — leaving entities empty here forces Orpheus to
    fall back to the *entire* raw utterance as the topic (e.g. "Brainstorm Ideas For My Project" instead
    of "My Project"). "keep going" / "continue this" on a piece of THE USER''S OWN fiction or verse is
    orpheus_continue_writing, matching voice/tense/style — not metis_expand_text, which adds supporting
    detail to functional text instead of extending a narrative voice. orpheus_rewrite_style vs. metis_rewrite_text:
    Orpheus shifts a piece''s creative VOICE/TONE (melancholic, playful, noir...) while preserving it
    as art; Metis rewrites for a functional GOAL (clarity, professionalism, confidence...). "Make this
    poem sound more melancholic" → Orpheus. "Make this email sound more confident" → Metis. "polish"/"clean
    it up" on a NEW piece is the optional Metis polish pass (entity polish: true). Editing a piece you
    already saved is orpheus_revise_creation, which adds a new version and keeps the original.'
  METIS (WRITING ASSISTANCE / EDITING): 'Scope boundary vs. Orpheus: fiction/verse/lyrics/brainstorming
    always go to orpheus_*, even though the verb ("write") overlaps. Everything else that edits, corrects,
    or drafts *utilitarian* text (emails, reports, cover letters, summaries, outlines, citations) is metis_*.
    "rewrite"/"reword" without a specific correction ask -> rewrite_text, with the requested quality as
    the "goal" entity. Exact numbers become targets, not the vague "length" entity: max_words / min_words
    / target_words (whole numbers) and target_grade (a U.S. grade level). A writing session is ONE request
    that both drafts (Orpheus) and then critiques/polishes (Metis). Extract the form (poem/story/lyrics)
    as "kind".'
  HEPHAESTUS (BROWSER): 'hephaestus_open_app launches a real native desktop application (Chrome the app,
    Notepad, Spotify, Edge, Firefox, Calculator, etc.) — this is NOT the same as hephaestus_browser_action,
    which only drives a headless automated browser. Use open_app whenever the user says "open"/"launch"
    and names a desktop application rather than a URL or website. hephaestus_scrape_page fetches and extracts
    readable text — either from a given URL, or by searching for a topic and reading the top result. Use
    this when the user wants the actual CONTENT of a page, not just a browser tab opened or a list of
    search result titles. hephaestus_watch_page starts a standing check of a web page that Hestia re-reads
    on a schedule and speaks up about only when something meaningful changes. Use it for "tell me when
    ..." / "keep an eye on ..." / "watch ..." about a PAGE. (Reminders about a time are chronos, not this.)
    Entities: url (required), keywords (list), track_price (true for price drops), target_price, interval
    ("hourly", "daily", "every 6 hours"), name. hephaestus_fill_form fills a form the user has SAVED by
    name in config; it never invents fields. entities.form is the saved name; entities.values carries
    any details the user spoke for the form''s {placeholders}. hephaestus_fill_form can also MANAGE forms.
    entities.action is "save" (read the fields from entities.url; set entities.submit true only if the
    user said to submit), "list" or "forget". The user never speaks selectors. hephaestus_summarize_repo
    summarises a LOCAL code folder (structure, size, tests, things worth a look). entities.path is a folder
    on this computer. entities.review is true only when the user asks for a REVIEW or opinion of the code
    (not just a summary); it needs the optional model review setting.'
  'REMINDERS: RECURRING, SNOOZE, LOCATION, TIME ZONES, HOLIDAYS': set_reminder also covers recurring reminders
    ("every weekday at 7am"), location reminders ("when I get home") and per-reminder time zones ("9am
    London time"). Pass the user's wording through in the entities; the module parses the rule itself,
    so do not invent cron strings.
  HERMES (GMAIL / CALENDAR): 'Pass the date through as the user typed it — DD/MM/YYYY is fine, do NOT
    try to reorder it into YYYY-MM-DD yourself; the calendar module parses both formats. Repeating events:
    pass the user''s own words through in "recurrence".'
